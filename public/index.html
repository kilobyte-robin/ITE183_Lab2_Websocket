<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Club Penguin BSL Multi-Room - Still Sprite & Backgrounds</title>
  <style>
    body { font-family: sans-serif; text-align: center; background-color: #2c3e50; color: white; margin: 0; padding: 20px; }
    #gameCanvas { background-color: #a0e0ff; border: 4px solid #fff; border-radius: 8px; cursor: pointer; }
    #controls { margin-top: 15px; display: flex; justify-content: center; gap: 10px; }
    #roomControls { margin-bottom: 10px; }
    input { padding: 10px; width: 300px; border-radius: 4px; border: none; }
    button { padding: 10px 20px; border-radius: 4px; border: none; background-color: #27ae60; color: white; font-weight: bold; cursor: pointer; }
    .roomBtn { background-color: #2980b9; margin: 0 5px; }
    .activeRoom { background-color: #f39c12; }
    #status { font-weight: bold; margin-bottom: 10px; }
  </style>
</head>
<body>

  <h2>Club Penguin BSL Room</h2>
  <div id="status">Connecting...</div>

  <div id="roomControls">
    <span>Current Room: </span>
    <button id="btnTown" class="roomBtn activeRoom" onclick="switchRoom('Town')">Town</button>
    <button id="btnPlaza" class="roomBtn" onclick="switchRoom('Plaza')">Plaza</button>
  </div>

  <canvas id="gameCanvas" width="700" height="400"></canvas>

  <div id="controls">
    <input type="text" id="chatInput" placeholder="Click canvas to walk or type chat here..." disabled />
    <button id="sendBtn" disabled>Chat</button>
  </div>

  <script>
  
    // IMAGE ASSET CONFIGURATION!!!!!!!!!!
    
    // Room Backgrounds will add later.........
    const townBg = new Image();
    townBg.src = "town_bg.png";

    const plazaBg = new Image();
    plazaBg.src = "plaza_bg.png";

    // Sprite soda
    const penguinSprite = new Image();
    penguinSprite.src = "penguin.png";

    // Adjust render size of the player sprite on canvas (in pixels)
    const SPRITE_WIDTH = 50;  
    const SPRITE_HEIGHT = 50;

    
    // 2. WEBSOCKET & CANVAS INITIALIZATION >:))
    
    const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
    const wsUrl = protocol + location.host;
    const socket = new WebSocket(wsUrl);

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const statusDiv = document.getElementById("status");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");

    let myClientId = null;
    let currentRoom = "Town";
    let players = {}; // { id: { room, x, y, targetX, targetY, speed, isMoving, facingLeft, waddleTimer, color, msg, msgTimer } }

    const colors = ["#e74c3c", "#3498db", "#9b59b6", "#f1c40f", "#e67e22", "#1abc9c"];

    function switchRoom(newRoom) {
      if (currentRoom === newRoom) return;

      currentRoom = newRoom;
      document.getElementById("btnTown").classList.toggle("activeRoom", currentRoom === "Town");
      document.getElementById("btnPlaza").classList.toggle("activeRoom", currentRoom === "Plaza");

      if (myClientId && players[myClientId]) {
        const startX = 350;
        const startY = 200;
        const color = colors[myClientId % colors.length];
        
        players[myClientId].room = currentRoom;
        players[myClientId].x = startX;
        players[myClientId].y = startY;
        players[myClientId].targetX = startX;
        players[myClientId].targetY = startY;

        socket.send(`MOVE:${currentRoom}:${myClientId}:${startX}:${startY}:${color}`);
      }
    }

    socket.onopen = function() {
      statusDiv.textContent = "Status: Connected";
      chatInput.disabled = false;
      sendBtn.disabled = false;
    };

    socket.onmessage = function(event) {
      const data = event.data;

      if (data.startsWith("SYSTEM:WELCOME:")) {
        myClientId = data.split(":")[2];
        const startX = Math.floor(Math.random() * 500) + 100;
        const startY = Math.floor(Math.random() * 200) + 100;
        const color = colors[myClientId % colors.length];

        socket.send(`MOVE:${currentRoom}:${myClientId}:${startX}:${startY}:${color}`);
      } 
      else if (data.startsWith("MOVE:")) {
        const [_, room, id, targetX, targetY, color] = data.split(":");
        const tx = parseInt(targetX);
        const ty = parseInt(targetY);

        if (!players[id]) {
          players[id] = {
            room: room,
            x: tx,
            y: ty,
            targetX: tx,
            targetY: ty,
            speed: 3,            // Movement speed (pixels per frame)
            isMoving: false,
            facingLeft: false,
            waddleTimer: 0,
            color: color,
            msg: "",
            msgTimer: null
          };
          
          if (id !== myClientId && myClientId && players[myClientId]) {
            const myPos = players[myClientId];
            socket.send(`MOVE:${myPos.room}:${myClientId}:${myPos.targetX}:${myPos.targetY}:${myPos.color}`);
          }
        } else {
          players[id].room = room;
          players[id].targetX = tx;
          players[id].targetY = ty;
          players[id].color = color;
        }
      } 
      else if (data.startsWith("CHAT:")) {
        const [_, room, id, text] = data.split(":");
        if (players[id] && room === currentRoom) {
          players[id].msg = text;
          clearTimeout(players[id].msgTimer);
          players[id].msgTimer = setTimeout(() => { players[id].msg = ""; }, 4000);
        }
      } 
      else if (data.startsWith("LEAVE:")) {
        const [_, id] = data.split(":");
        delete players[id];
      }
    };

    // Click canvas to move penguin
    canvas.addEventListener("click", function(e) {
      if (!myClientId || !players[myClientId]) return;
      
      const rect = canvas.getBoundingClientRect();
      const targetX = Math.round(e.clientX - rect.left);
      const targetY = Math.round(e.clientY - rect.top);
      const color = colors[myClientId % colors.length];

      players[myClientId].targetX = targetX;
      players[myClientId].targetY = targetY;

      socket.send(`MOVE:${currentRoom}:${myClientId}:${targetX}:${targetY}:${color}`);
    });

    function sendChatMessage() {
      const text = chatInput.value.trim();
      if (text && socket.readyState === WebSocket.OPEN) {
        socket.send(`CHAT:${currentRoom}:${myClientId}:${text}`);
        chatInput.value = "";
      }
    }

    sendBtn.addEventListener("click", sendChatMessage);
    chatInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendChatMessage(); });

    // RENDER & WADDLE LOOP!!!!!1!!111!!!!
  
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // ROOM BACKGROUND RENDERING
      if (currentRoom === "Town") {
        if (townBg.complete && townBg.naturalWidth !== 0) {
          ctx.drawImage(townBg, 0, 0, canvas.width, canvas.height);
        } else {
          // Color fallback if town_bg.png isn't loaded
          ctx.fillStyle = "#a0e0ff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#2c3e50";
          ctx.font = "bold 20px sans-serif";
          ctx.fillText("TOWN (Add town_bg.png to public/)", 170, 40);
        }
      } else {
        if (plazaBg.complete && plazaBg.naturalWidth !== 0) {
          ctx.drawImage(plazaBg, 0, 0, canvas.width, canvas.height);
        } else {
          // Color fallback if plaza_bg.png isn't loaded
          ctx.fillStyle = "#f39c12";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 20px sans-serif";
          ctx.fillText("PLAZA (Add plaza_bg.png to public/)", 170, 40);
        }
      }

      // PLAYER UPDATE & RENDERING11!!!!
      for (let id in players) {
        const p = players[id];

        // point and click movement calculation
        const dx = p.targetX - p.x;
        const dy = p.targetY - p.y;
        const dist = Math.hypot(dx, dy);

        if (dist > p.speed) {
          p.x += (dx / dist) * p.speed;
          p.y += (dy / dist) * p.speed;
          p.isMoving = true;
          p.facingLeft = dx < 0; // fglip sprite horizontally when walking left
          p.waddleTimer++;
        } else {
          p.x = p.targetX;
          p.y = p.targetY;
          p.isMoving = false;
          p.waddleTimer = 0; // reset waddle angle when stationary
        }

        // draw player if in the current room
        if (p.room === currentRoom) {
          let waddleAngle = 0;
          let waddleOffsetY = 0;

          // clculate waddle tilt and hop when moving
          if (p.isMoving) {
            waddleAngle = Math.sin(p.waddleTimer * 0.2) * 0.15;          // Side-to-side tilt angle
            waddleOffsetY = Math.abs(Math.sin(p.waddleTimer * 0.2)) * -6; // Up/down bounce offset
          }

          ctx.save();
          ctx.translate(p.x, p.y + waddleOffsetY);
          ctx.rotate(waddleAngle);

          // horizontal flip when facing left
          if (p.facingLeft) {
            ctx.scale(-1, 1);
          }

          if (penguinSprite.complete && penguinSprite.naturalWidth !== 0) {
            // render user' still sprite image centered at player coordinates
            ctx.drawImage(
              penguinSprite,
              -SPRITE_WIDTH / 2,
              -SPRITE_HEIGHT / 2,
              SPRITE_WIDTH,
              SPRITE_HEIGHT
            );
          } else {
            // fallback canvas drawing if penguin.png isn't uploaded yet
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.fillStyle = p.color || "#333";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#000";
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 3, 11, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();

            ctx.beginPath();
            ctx.fillStyle = "#f39c12";
            ctx.moveTo(10, -2);
            ctx.lineTo(22, 2);
            ctx.lineTo(10, 6);
            ctx.closePath();
            ctx.fill();
          }

          ctx.restore();

          // player nametag
          ctx.fillStyle = "#000";
          ctx.font = "bold 12px sans-serif";
          ctx.fillText(`Player-${id}`, p.x - 25, p.y + 35);

          // Chat buubble
          if (p.msg) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(p.x - 50, p.y - 50, 100, 22);
            ctx.fillStyle = "#fff";
            ctx.font = "12px sans-serif";
            ctx.fillText(p.msg, p.x - 45, p.y - 35);
          }
        }
      }

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
